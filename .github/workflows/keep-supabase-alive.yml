name: Keep Supabase Alive

on: 
  schedule: 
    # Har 2 din mein ek baar automatic chalega
    - cron: '0 0 */2 * *' 
  workflow\_dispatch: # Manual test karne ke liye 
  
  
jobs: 
  ping-supabase: 
   runs-on: ubuntu-latest
    steps:
     - name: Ping Supabase REST API
      run: | curl -s -f -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
       -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
       -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"