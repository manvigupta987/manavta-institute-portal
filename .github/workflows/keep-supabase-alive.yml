name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          URL="${URL%/}"
          echo "Pinging $URL/rest/v1/ ..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "$URL/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "$response"
          if [[ "$response" == *"HTTP_STATUS:200"* ]]; then
            echo "Successfully pinged Supabase!"
            exit 0
          else
            echo "Failed to ping Supabase! Check your SUPABASE_URL and SUPABASE_ANON_KEY secrets in GitHub."
            exit 1
          fi
